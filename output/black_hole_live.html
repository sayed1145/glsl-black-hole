 function texture(size,internal,type,linear){const t=gl.createTexture();ownedTextures.push(t);gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,linear?gl.LINEAR:gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,linear?gl.LINEAR:gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,internal,size,size,0,gl.RGBA,type,null);return t;}
 function framebuffer(textures){const fb=gl.createFramebuffer();ownedFbos.push(fb);gl.bindFramebuffer(gl.FRAMEBUFFER,fb);const draw=[];textures.forEach((t,i)=>{gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0);draw.push(gl.COLOR_ATTACHMENT0+i);});gl.drawBuffers(draw);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw new Error('浮点帧缓冲不完整');return fb;}
 function target(size){const t=texture(size,gl.RGBA16F,gl.HALF_FLOAT,true);return {texture:t,fbo:framebuffer([t]),size};}
 function common(p,time){v2(p,'uResolution',n,n);v2(p,'uCenter',...PARAMETERS.center);f(p,'uTilt',PARAMETERS.tilt);f(p,'uTime',time%8);}
 function draw(p,fb,size){gl.useProgram(p.program);gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.viewport(0,0,size,size);}
 function triangle(){gl.drawArrays(gl.TRIANGLES,0,3);}
 function setup(size){
  ownedTextures.splice(0).forEach(t=>gl.deleteTexture(t));ownedFbos.splice(0).forEach(fb=>gl.deleteFramebuffer(fb));
  n=size;canvas.width=n;canvas.height=n;
  maps=Array.from({length:3},()=>texture(n,gl.RGBA32F,gl.FLOAT,false));geoFbo=framebuffer(maps);hdr=target(n);blooms=[2,4,12,24].map(d=>[target(Math.max(8,Math.floor(n/d))),target(Math.max(8,Math.floor(n/d)))]);
  const p=programs.geometry;draw(p,geoFbo,n);common(p,0);f(p,'uScale',PARAMETERS.scale);f(p,'uInclination',PARAMETERS.inclination);f(p,'uInner',PARAMETERS.inner);triangle();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);statusEl.textContent='实时 · 无贴图';
 }
 function render(time){
  let p=programs.emission;draw(p,hdr.fbo,n);common(p,time);maps.forEach((t,i)=>tex(p,'uMap'+i,i,t));triangle();
  p=programs.blur;let source=hdr.texture;
  for(const [a,b] of blooms){draw(p,a.fbo,a.size);v2(p,'uResolution',a.size,a.size);v2(p,'uDirection',1/a.size,0);tex(p,'uSource',0,source);triangle();draw(p,b.fbo,b.size);v2(p,'uDirection',0,1/b.size);tex(p,'uSource',0,a.texture);triangle();source=b.texture;}
  p=programs.composite;draw(p,null,n);common(p,time);tex(p,'uEmission',0,hdr.texture);blooms.forEach((pair,i)=>tex(p,'uBloom'+i,i+1,pair[1].texture));triangle();
 }
 const pauseBtn=document.getElementById('toggle'),seek=document.getElementById('seek'),clock=document.getElementById('clock');
 let paused=false,elapsed=0,speed=1,last=performance.now(),dirty=true;
 function updateTime(){seek.value=String(elapsed%8);clock.value=(elapsed%8).toFixed(2)+' / 8 s';}
 function toggle(){paused=!paused;pauseBtn.textContent=paused?'播放':'暂停';pauseBtn.setAttribute('aria-label',paused?'播放动画':'暂停动画');}
 pauseBtn.addEventListener('click',toggle);
 document.getElementById('reset').addEventListener('click',()=>{elapsed=0;dirty=true;updateTime();});
 document.getElementById('speed').addEventListener('change',e=>speed=Number(e.target.value));
 document.getElementById('quality').addEventListener('change',e=>{try{setup(Number(e.target.value));dirty=true;}catch(error){showError(error);}});
 seek.addEventListener('input',()=>{elapsed=Number(seek.value);dirty=true;updateTime();});
 document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggle();}});
 document.addEventListener('visibilitychange',()=>last=performance.now());
 gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);setup(960);
 const testMode=new URLSearchParams(location.search).has('test');if(testMode){paused=true;pauseBtn.textContent='播放';}
 function animate(now){const dt=Math.min((now-last)/1000,.15);last=now;if(!paused&&!document.hidden){elapsed=(elapsed+dt*speed)%8;dirty=true;}if(dirty){render(elapsed);updateTime();dirty=false;}requestAnimationFrame(animate);}
 window.shaderDemo={renderAt(t){paused=true;elapsed=t%8;render(elapsed);updateTime();pauseBtn.textContent='播放';},getState(){return {paused,time:elapsed,size:n,error:gl.getError()};},setQuality(s){setup(s);render(elapsed);}};
 window.__shaderReady=true;requestAnimationFrame(animate);
}catch(error){showError(error);}
</script>
